name: Sync NetHack-cn WASM

on:
  schedule:
    # Daily at 04:00 Asia/Shanghai.
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      nethack_ref:
        description: "StackC00ki3/Nethack-cn ref to build."
        required: false
        default: "Nethack-CN-5.0.0"
        type: string

permissions:
  contents: write

concurrency:
  group: nethack-cn-sync-pages
  cancel-in-progress: true

jobs:
  sync-wasm:
    runs-on: ubuntu-latest
    env:
      NETHACK_CN_REPO: StackC00ki3/Nethack-cn
      NETHACK_CN_REF: ${{ github.event.inputs.nethack_ref || 'Nethack-CN-5.0.0' }}
      NETHACK_CN_DIR: nethack-cn

    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout NetHack-cn source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NETHACK_CN_REPO }}
          ref: ${{ env.NETHACK_CN_REF }}
          path: ${{ env.NETHACK_CN_DIR }}
          submodules: recursive

      - name: Resolve NetHack-cn revision
        id: nethack_cn
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha="$(git -C "${NETHACK_CN_DIR}" rev-parse HEAD)"
          upstream_short_sha="$(git -C "${NETHACK_CN_DIR}" rev-parse --short HEAD)"
          {
            echo "sha=${upstream_sha}"
            echo "short_sha=${upstream_short_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            build-essential \
            ca-certificates \
            curl \
            flex \
            gettext \
            git \
            python3 \
            unzip

      - name: Install Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "${RUNNER_TEMP}/emsdk"
          "${RUNNER_TEMP}/emsdk/emsdk" install latest
          "${RUNNER_TEMP}/emsdk/emsdk" activate latest

      - name: Build NetHack-cn WASM
        shell: bash
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/emsdk/emsdk_env.sh"
          cd "${NETHACK_CN_DIR}"
          python3 ../scripts/sync/patch_nethack_cn_libnh.py .
          sed -i \
            -e 's/[[:space:]]-Werror\>//g' \
            sys/unix/hints/linux.500
          cat >> sys/unix/hints/linux.500 <<'EOF'

# nethack-3d reads glyph_info.tileidx at runtime; this must be present
# before setup.sh generates the Makefiles so all objects agree on glyph_info.
CFLAGS += -DTILES_IN_GLYPHMAP
CPPFLAGS += -DTILES_IN_GLYPHMAP
EOF
          grep -nE "TILES_IN_GLYPHMAP|^[[:space:]]*(CFLAGS|CPPFLAGS)[[:space:]]*[:+?]?=" sys/unix/hints/linux.500
          cd sys/unix
          ./setup.sh hints/linux.500
          cd ../..
          find . -name Makefile -type f -print0 | xargs -0 grep -H "TILES_IN_GLYPHMAP"
          make fetch-lua
          make CROSS_TO_WASM=1 all -j"$(nproc)"
          test -s targets/wasm/nethack.js
          test -s targets/wasm/nethack.wasm
          test -s src/role.c

      - name: Verify NetHack-cn tile indexes
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import { pathToFileURL } from "node:url";

          const sourceJs = path.resolve(
            process.env.NETHACK_CN_DIR,
            "targets/wasm/nethack.js",
          );
          const sourceWasm = path.resolve(
            process.env.NETHACK_CN_DIR,
            "targets/wasm/nethack.wasm",
          );
          const runtimeJs = path.resolve(
            process.env.RUNNER_TEMP,
            "nethack-cn-runtime.mjs",
          );
          fs.copyFileSync(sourceJs, runtimeJs);

          globalThis.nethackCallback = (name) => {
            switch (name) {
              case "shim_get_nh_event":
              case "shim_nhgetch":
              case "shim_nh_poskey":
              case "shim_yn_function":
                return 27;
              case "shim_select_menu":
                return 0;
              case "shim_getmsghistory":
                return "";
              case "shim_askname":
              case "shim_getlin":
                return "TileSmoke";
              case "shim_create_nhwindow":
                return 1;
              case "shim_player_selection_cb":
              case "shim_player_selection_or_tty":
                return true;
              default:
                return 0;
            }
          };

          const { default: factory } = await import(pathToFileURL(runtimeJs).href);
          const Module = await factory({
            noInitialRun: true,
            wasmBinary: fs.readFileSync(sourceWasm),
            locateFile: (assetPath) => assetPath,
            print: () => {},
            printErr: () => {},
            preRun: [
              (mod) => {
                mod.ENV = mod.ENV || {};
                mod.ENV.NETHACKOPTIONS =
                  "autoquiver,name:TileSmoke,map_mode:tiles";
              },
            ],
          });

          Module.cwrap("shim_graphics_set_callback", null, ["string"])(
            "nethackCallback",
          );
          try {
            Module._main(0, 0);
          } catch {
            // Expected: Asyncify suspends once startup reaches input.
          }

          const helper = globalThis.nethackGlobal?.helpers?.tileIndexForGlyph;
          if (typeof helper !== "function") {
            throw new Error("tileIndexForGlyph helper was not installed.");
          }

          const sampleGlyphs = [0, 1, 2, 10, 100];
          const tileIndexes = sampleGlyphs.map((glyph) => Number(helper(glyph)));
          if (
            tileIndexes.some((tileIndex) => !Number.isFinite(tileIndex)) ||
            new Set(tileIndexes).size <= 1 ||
            tileIndexes[1] === 0
          ) {
            throw new Error(
              `NetHack-cn tileidx smoke test failed: ${JSON.stringify(
                Object.fromEntries(
                  sampleGlyphs.map((glyph, index) => [glyph, tileIndexes[index]]),
                ),
              )}`,
            );
          }

          console.log(
            `NetHack-cn tileidx smoke test passed: ${JSON.stringify(
              Object.fromEntries(
                sampleGlyphs.map((glyph, index) => [glyph, tileIndexes[index]]),
              ),
            )}`,
          );
          NODE

      - name: Copy runtime and role sources
        shell: bash
        run: |
          set -euo pipefail
          cp "${NETHACK_CN_DIR}/targets/wasm/nethack.js" public/nethack-5.js
          cp "${NETHACK_CN_DIR}/targets/wasm/nethack.wasm" public/nethack-5.wasm
          cp "${NETHACK_CN_DIR}/src/role.c" imported/role-sources/5.0/role.c

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Regenerate derived data
        shell: bash
        run: |
          set -euo pipefail
          npm run startup:generate-rulesets
          npm run glyphs:generate -- --version 5.0
          npm run startup:check-rulesets
          npm run glyphs:check -- --version 5.0

      - name: Commit synchronized artifacts
        shell: bash
        run: |
          set -euo pipefail
          git add \
            public/nethack-5.js \
            public/nethack-5.wasm \
            imported/role-sources/5.0/role.c \
            src/game/helpers/startup-character-rulesets.generated.ts \
            src/game/glyphs/glyph-catalog.5.generated.ts

          if git diff --cached --quiet; then
            echo "No NetHack-cn WASM changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync NetHack-cn WASM ${{ steps.nethack_cn.outputs.short_sha }}"
          git push
